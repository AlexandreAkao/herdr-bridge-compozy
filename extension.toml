[extension]
name = "herdr-bridge"
version = "0.1.0"
description = "Reflete o estado dos agentes do CompozyOS como linhas de agente no herdr, com o log do agente colorido no pane."
min_compozy_version = "0.3.0-beta.1"

[capabilities]
provides = []

[permissions]
requires = []

[[resources.hooks]]
name = "herdr.session_post_create"
event = "session.post_create"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }

[[resources.hooks]]
name = "herdr.turn_start"
event = "turn.start"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }

[[resources.hooks]]
name = "herdr.turn_end"
event = "turn.end"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }

[[resources.hooks]]
name = "herdr.permission_request"
event = "permission.request"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }

[[resources.hooks]]
name = "herdr.session_post_stop"
event = "session.post_stop"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }

[[resources.hooks]]
name = "herdr.agent_stopped"
event = "agent.stopped"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }

[[resources.hooks]]
name = "herdr.agent_crashed"
event = "agent.crashed"
mode = "async"
timeout = "5s"
executor = { kind = "subprocess", command = "{{config_dir}}/bridge.py" }
