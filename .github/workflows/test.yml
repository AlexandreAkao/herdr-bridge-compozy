name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  colorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render fixture and assert filters
        run: python3 tests/test_colorize.py
